<script>const questions=[{"title": "飞机飞行策略", "tag": "策略模式", "context": "某飞行仿真系统要求在运行时为不同飞机切换起飞与飞行方式。请补全 C 语言代码，实现函数指针形式的策略注入。", "code": "#include <stdio.h>\n\ntypedef void (*FlyFn)(void);\ntypedef void (*TakeoffFn)(void);\n\ntypedef struct {\n    FlyFn fly;\n    TakeoffFn takeoff;\n} Aircraft;\n\nvoid subsonic(void) { puts(\"亚音速飞行\"); }\nvoid supersonic(void) { puts(\"超音速飞行\"); }\nvoid vertical(void) { puts(\"垂直起飞\"); }\nvoid longDistance(void) { puts(\"长距离起飞\"); }\n\nvoid init(Aircraft *a, FlyFn f, TakeoffFn t) {\n    a->___1___ = f;\n    a->takeoff = ___2___;\n}\nvoid perform(Aircraft *a) {\n    a->takeoff();\n    a->___3___();\n}\nint main(void) {\n    Aircraft helicopter;\n    init(&helicopter, ___4___, vertical);\n    perform(&helicopter);\n    helicopter.fly = ___5___;\n    perform(&helicopter);\n    return 0;\n}", "answers": ["fly", "t", "fly", "subsonic", "supersonic"], "explains": ["结构体保存飞行策略的函数指针。", "形参 t 即传入的起飞策略。", "通过结构体中的函数指针调用飞行行为。", "初始化为亚音速飞行策略。", "运行时可替换策略，而不必修改执行函数。"]}, {"title": "订单折扣计算", "tag": "策略模式", "context": "购物平台支持普通会员和 VIP 两种折扣算法，要求结算逻辑不随折扣方案增加而修改。", "code": "#include <stdio.h>\n\ntypedef double (*Discount)(double);\n\ntypedef struct {\n    Discount rule;\n} Order;\n\ndouble normal(double p) { return p; }\ndouble vip(double p) { return p * 0.8; }\n\nvoid setDiscount(Order *o, Discount d) {\n    o->___1___ = d;\n}\ndouble checkout(const Order *o, double price) {\n    return o->rule(___2___);\n}\nint main(void) {\n    Order o;\n    setDiscount(&o, ___3___);\n    printf(\"%.2f\\n\", checkout(&o, 100));\n    setDiscount(&o, ___4___);\n    printf(\"%.2f\\n\", ___5___(&o, 100));\n    return 0;\n}", "answers": ["rule", "price", "normal", "vip", "checkout"], "explains": ["保存当前使用的折扣函数。", "把订单金额传给折扣算法。", "普通会员不打折。", "VIP 会员使用八折算法。", "调用统一结算接口。"]}, {"title": "设备状态变化通知", "tag": "观察者模式", "context": "计量设备完成采集后，需要通知显示屏和日志模块。用回调函数数组模拟观察者列表。", "code": "#include <stdio.h>\n#define MAX_OBS 4\n\ntypedef void (*Observer)(int);\ntypedef struct {\n    Observer list[MAX_OBS];\n    int count;\n} Device;\n\nvoid show(int value) { printf(\"显示:%d\\n\", value); }\nvoid logValue(int value) { printf(\"日志:%d\\n\", value); }\n\nvoid subscribe(Device *d, Observer fn) {\n    if (d->count < MAX_OBS)\n        d->list[d->___1___++] = fn;\n}\nvoid notify(Device *d, int v) {\n    for (int i = 0; i < d->count; i++)\n        d->list[i](___2___);\n}\nint main(void) {\n    Device d = {0};\n    subscribe(&d, ___3___);\n    subscribe(&d, ___4___);\n    ___5___(&d, 42);\n    return 0;\n}", "answers": ["count", "v", "show", "logValue", "notify"], "explains": ["count 既是当前元素数量也是下一写入下标。", "把最新测量值传递给每个订阅者。", "注册显示屏观察者。", "注册日志观察者。", "值更新时向所有观察者发送通知。"]}, {"title": "传感器对象创建", "tag": "工厂模式", "context": "不同类型的传感器需要通过统一创建函数初始化，而调用者无需了解具体初始化过程。", "code": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct Sensor {\n    int type;\n    double (*read)(void);\n} Sensor;\n\ndouble readTemp(void) { return 25.0; }\ndouble readVolt(void) { return 3.3; }\n\nSensor *createSensor(int type) {\n    Sensor *s = (Sensor *)___1___(sizeof(Sensor));\n    if (s == NULL) return NULL;\n    s->type = type;\n    if (type == 1)\n        s->read = ___2___;\n    else\n        s->read = ___3___;\n    return s;\n}\nint main(void) {\n    Sensor *s = ___4___(1);\n    if (s != NULL) {\n        printf(\"%.1f\\n\", s->read());\n        ___5___(s);\n    }\n    return 0;\n}", "answers": ["malloc", "readTemp", "readVolt", "createSensor", "free"], "explains": ["通过 malloc 为新对象分配堆内存。", "类型 1 绑定温度采集函数。", "其他类型绑定电压采集函数。", "客户端只调用统一工厂创建接口。", "释放工厂分配的堆内存。"]}, {"title": "系统全局配置", "tag": "单例模式", "context": "实验室软件需要让多个模块共享同一份配置数据。用 C 语言的静态局部变量实现单例访问。", "code": "#include <stdio.h>\n\ntypedef struct {\n    int timeout;\n    int retry;\n} Config;\n\nConfig *getConfig(void) {\n    static Config config = {30, 3};\n    return &___1___;\n}\nvoid updateTimeout(int value) {\n    Config *p = ___2___();\n    p->timeout = ___3___;\n}\nint main(void) {\n    Config *a = getConfig();\n    Config *b = ___4___();\n    updateTimeout(60);\n    printf(\"%d\\n\", b->___5___);\n    return 0;\n}", "answers": ["config", "getConfig", "value", "getConfig", "timeout"], "explains": ["返回同一静态对象的地址。", "通过统一入口获取全局配置。", "使用函数参数更新超时值。", "第二次调用仍得到同一个对象指针。", "读取修改后共享的 timeout 字段。"]}, {"title": "旧仪器接口兼容", "tag": "适配器模式", "context": "新程序统一调用 readValue，但旧仪器驱动只提供 oldRead。设计适配函数连接新旧接口。", "code": "#include <stdio.h>\n\ntypedef struct {\n    int (*readValue)(void *ctx);\n    void *ctx;\n} Meter;\n\ntypedef struct {\n    int raw;\n} LegacyMeter;\n\nint oldRead(LegacyMeter *old) { return old->raw; }\n\nint adapterRead(void *ctx) {\n    LegacyMeter *p = (LegacyMeter *)___1___;\n    return ___2___(p);\n}\nvoid useMeter(Meter *m) {\n    printf(\"测量值:%d\\n\", m->___3___(m->ctx));\n}\nint main(void) {\n    LegacyMeter old = {220};\n    Meter m;\n    m.readValue = ___4___;\n    m.ctx = &___5___;\n    useMeter(&m);\n    return 0;\n}", "answers": ["ctx", "oldRead", "readValue", "adapterRead", "old"], "explains": ["将通用上下文指针还原为旧设备指针。", "调用旧驱动的读取方法。", "调用新接口约定的函数指针。", "把适配函数赋值给新接口。", "把旧设备实例作为上下文传入。"]}, {"title": "计量操作命令", "tag": "命令模式", "context": "将设备“开始”和“停止”操作封装为统一命令，通过命令对象执行并支持自由切换。", "code": "#include <stdio.h>\n\ntypedef void (*Action)(void *);\ntypedef struct { Action execute; void *receiver; } Command;\ntypedef struct { int running; } Device;\n\nvoid start(void *ctx) {\n    Device *d = (Device *)ctx;\n    d->running = 1;\n}\nvoid stop(void *ctx) {\n    Device *d = (Device *)ctx;\n    d->running = 0;\n}\nvoid runCommand(Command *c) {\n    c->___1___(c->receiver);\n}\nint main(void) {\n    Device d = {0};\n    Command c1 = {___2___, &d};\n    Command c2 = {___3___, &d};\n    runCommand(&c1);\n    printf(\"%d\\n\", d.___4___);\n    ___5___(&c2);\n    return 0;\n}", "answers": ["execute", "start", "stop", "running", "runCommand"], "explains": ["命令对象保存 execute 函数指针。", "绑定开始动作。", "绑定停止动作。", "读取执行后设备的运行状态。", "通过同一个命令入口执行停止指令。"]}, {"title": "网络连接状态切换", "tag": "状态模式", "context": "网络连接有断开和已连接两种状态。通过状态函数处理事件，避免在调用层反复判断状态。", "code": "#include <stdio.h>\n\ntypedef struct Connection Connection;\ntypedef void (*StateFn)(Connection *);\nstruct Connection { StateFn onEvent; int connected; };\n\nvoid connectedState(Connection *c);\nvoid disconnectedState(Connection *c) {\n    c->connected = 1;\n    c->onEvent = ___1___;\n    puts(\"连接成功\");\n}\nvoid connectedState(Connection *c) {\n    c->connected = 0;\n    c->onEvent = ___2___;\n    puts(\"连接断开\");\n}\nvoid trigger(Connection *c) {\n    c->___3___(c);\n}\nint main(void) {\n    Connection c = {___4___, 0};\n    trigger(&c);\n    trigger(&c);\n    printf(\"%d\\n\", c.___5___);\n    return 0;\n}", "answers": ["connectedState", "disconnectedState", "onEvent", "disconnectedState", "connected"], "explains": ["断开状态收到事件后切换到已连接状态处理函数。", "连接状态收到事件后切换回断开状态。", "状态函数由当前对象决定。", "初始状态是断开。", "第二次事件后 connected 为 0。"]}, {"title": "测试数据处理流水线", "tag": "责任链模式", "context": "测试结果先做范围检查，再做日志记录。每个处理器执行后可把数据交给下一个处理器。", "code": "#include <stdio.h>\n\ntypedef struct Handler Handler;\nstruct Handler {\n    int (*handle)(Handler *, int);\n    Handler *next;\n};\nint logHandler(Handler *h, int v) {\n    printf(\"记录:%d\\n\", v);\n    return 1;\n}\nint rangeHandler(Handler *h, int v) {\n    if (v < 0 || v > 100) return 0;\n    if (h->___1___ != NULL)\n        return h->next->handle(h->next, ___2___);\n    return 1;\n}\nint main(void) {\n    Handler log = {___3___, NULL};\n    Handler range = {___4___, &log};\n    int ok = range.handle(&range, 80);\n    printf(\"%d\\n\", ___5___);\n    return 0;\n}", "answers": ["next", "v", "logHandler", "rangeHandler", "ok"], "explains": ["next 指向责任链中的后继处理器。", "将同一测试值传递给下一个处理器。", "日志节点绑定日志处理函数。", "首节点绑定范围检查函数。", "输出责任链处理的结果。"]}, {"title": "消息发送功能增强", "tag": "装饰器模式", "context": "不修改基础发送函数，通过包装函数在发送前增加审计记录，实现类似装饰器的功能。", "code": "#include <stdio.h>\n\ntypedef void (*SendFn)(const char *);\ntypedef struct { SendFn base; } Sender;\n\nvoid basicSend(const char *msg) {\n    printf(\"发送:%s\\n\", msg);\n}\nvoid auditSend(Sender *s, const char *msg) {\n    puts(\"审计:准备发送\");\n    s->___1___(msg);\n    puts(\"审计:完成发送\");\n}\nvoid send(Sender *s, const char *msg, int audit) {\n    if (audit)\n        ___2___(s, msg);\n    else\n        s->base(___3___);\n}\nint main(void) {\n    Sender s = {___4___};\n    ___5___(&s, \"检定完成\", 1);\n    return 0;\n}", "answers": ["base", "auditSend", "msg", "basicSend", "send"], "explains": ["装饰器内部需要保存原始行为。", "启用审计时调用包装函数。", "未启用审计时直接传入原消息。", "初始发送行为由基础函数提供。", "通过统一发送入口触发装饰逻辑。"]}];const STORE='ruankao_c10_v1';let current=0;let state;try{state=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}if(!state||!Array.isArray(state.answers)||state.answers.length!==questions.length){state={answers:questions.map(q=>q.answers.map(()=>'')),graded:{},revealed:{}}}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}function norm(s){return String(s??'').trim().replace(/\s+/g,'').replace(/^&/,'&')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function total(){let cnt=0,correct=0,filled=0;questions.forEach((q,i)=>{if(state.graded[i]){cnt++;q.answers.forEach((a,j)=>{filled++;if(norm(state.answers[i][j])===norm(a))correct++})}});$('complete').textContent=cnt+'/10';$('accuracy').textContent=filled?Math.round(correct/filled*100)+'%':'—'}function showNav(){const n=$('nav');n.innerHTML='';questions.forEach((q,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(i===current?'active ':'')+(state.graded[i]?'done':'');b.setAttribute('aria-label','第'+(i+1)+'题');b.onclick=()=>go(i);n.append(b)});total()}function render(){let q=questions[current];$('tag').textContent=q.tag;$('page').textContent=(current+1)+' / '+questions.length;$('title').textContent=q.title;$('context').textContent=q.context;$('code').innerHTML=escapeHtml(q.code).replace(/___(\d+)___/g,'<span class="blank">（$1）</span>');$('fields').innerHTML='';q.answers.forEach((a,j)=>{let row=document.createElement('label');row.className='answer';let label=document.createElement('span');label.className='num';label.textContent='第 '+(j+1)+' 空';let inp=document.createElement('input');inp.value=state.answers[current][j]||'';inp.placeholder='填写代码';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.setAttribute('aria-label','第'+(j+1)+'空');if(state.graded[current])inp.classList.add(norm(inp.value)===norm(a)?'correct':'wrong');inp.oninput=()=>{state.answers[current][j]=inp.value;delete state.graded[current];showNav();$('feedback').classList.add('hidden');inp.classList.remove('correct','wrong');save()};row.append(label,inp);$('fields').append(row)});$('feedback').classList.add('hidden');$('solutions').classList.add('hidden');if(state.graded[current])feedback();if(state.revealed[current])solutions();showNav();$('prev').disabled=current===0;$('next').textContent=current===9?'返回第 1 题 ↻':'下一题 →'}function feedback(){let q=questions[current],hit=q.answers.filter((a,j)=>norm(state.answers[current][j])===norm(a)).length,f=$('feedback');f.className='feedback '+(hit===q.answers.length?'good':'');f.textContent='本题得分 '+(hit*3)+'/15 分，答对 '+hit+'/'+q.answers.length+' 空。'+(hit===q.answers.length?' 全部正确！':' 红色框表示填写与参考答案不一致，可修改后重新批改。');$('fields').querySelectorAll('input').forEach((input,j)=>{input.classList.toggle('correct',norm(state.answers[current][j])===norm(q.answers[j]));input.classList.toggle('wrong',norm(state.answers[current][j])!==norm(q.answers[j]))})}function solutions(){let q=questions[current];$('solutions').innerHTML='<b>参考答案与解析</b>'+q.answers.map((a,i)=>'<div class="solution"><strong>第 '+(i+1)+' 空：</strong> <code>'+escapeHtml(a)+'</code><p>'+escapeHtml(q.explains[i])+'</p></div>').join('');$('solutions').classList.remove('hidden')}function go(i){current=(i+10)%10;render();window.scrollTo({top:0,behavior:'smooth'})}$('check').onclick=()=>{state.graded[current]=true;save();render();$('feedback').scrollIntoView({bl
