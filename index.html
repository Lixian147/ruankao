function grade(){
 const q=questions[index],inputs=[...app.querySelectorAll('input[data-index]')];let n=0;
 const lines=inputs.map((el,i)=>{let ok=norm(el.value)===norm(q.answers[i]);if(ok)n++;el.style.borderColor=ok?'#16a34a':'#dc2626';return `第 ${i+1} 空：${ok?'匹配正确':'未匹配参考答案'}`});
 const result=document.getElementById('result');result.hidden=false;result.innerHTML=`<b>本题结果：${n}/${q.answers.length} 空匹配</b><br>${lines.join('<br>')}<p class="small">自动批改按文本匹配；如果你的写法与参考答案不同但语义正确，请结合完整代码和解析判断。</p>`;
}
selector.onchange=()=>{index=Number(selector.value);render()};
document.getElementById('prev').onclick=()=>{index=(index+questions.length-1)%questions.length;render()};
document.getElementById('next').onclick=()=>{index=(index+1)%questions.length;render()};
render();
</script>
</body>
</html>
